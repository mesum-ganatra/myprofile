<!DOCTYPE html>
<html lang="en" class="dark auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Blog admin</title>
  <script>(function(){var t=null;try{t=localStorage.getItem('portfolio_theme');}catch(e){}document.documentElement.classList.toggle('dark',t!=='light');})();</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/admin/admin.css" />
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/admin"><i class="fa-solid fa-pen-nib"></i> Blog admin</a>
    <span class="grow"></span>
    <a class="btn" href="/blog" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View blog</a>
    <a class="btn primary" href="/admin/editor"><i class="fa-solid fa-plus"></i> New post</a>
    <button class="btn" id="logout" type="button"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
  </div>
  <main class="wrap">
    <div class="stats">
      <div class="card stat"><b id="s-total">-</b><span>Total</span></div>
      <div class="card stat"><b id="s-pub">-</b><span>Published</span></div>
      <div class="card stat"><b id="s-draft">-</b><span>Drafts</span></div>
    </div>
    <div class="filters">
      <input id="q" class="input" type="search" placeholder="Search posts" aria-label="Search posts" />
      <select id="f" class="input" aria-label="Filter by status">
        <option value="all">All statuses</option><option value="published">Published</option><option value="draft">Drafts</option>
      </select>
    </div>
    <div id="msg" class="hint"></div>
    <div id="list"></div>
  </main>

  <dialog id="confirm">
    <h3 id="c-title"></h3>
    <p id="c-text" class="hint" style="font-size:.9rem"></p>
    <div class="row"><button class="btn" id="c-no" type="button">Cancel</button><button class="btn danger" id="c-yes" type="button">Delete</button></div>
  </dialog>
  <script type="module" src="/assets/admin/dashboard.js"></script>
</body>
</html>
