<!DOCTYPE html>
<html lang="en" class="dark auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Post editor</title>
  <script>(function(){var t=null;try{t=localStorage.getItem('portfolio_theme');}catch(e){}document.documentElement.classList.toggle('dark',t!=='light');})();</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/admin/admin.css" />
  <link rel="stylesheet" href="/assets/prose.css" />
  <link rel="stylesheet" href="/assets/blog.css" />
</head>
<body>
  <div class="topbar">
    <a class="btn sm" href="/admin"><i class="fa-solid fa-arrow-left"></i> Posts</a>
    <span id="badge" class="badge draft">Draft</span>
    <span id="savestate" class="hint">New post</span>
    <span class="grow"></span>
    <button class="btn" id="btn-preview" type="button"><i class="fa-regular fa-eye"></i> Preview</button>
    <a class="btn hidden" id="btn-view" href="#" target="_blank" rel="noopener" style="display:none"><i class="fa-solid fa-arrow-up-right-from-square"></i> View</a>
    <button class="btn" id="btn-draft" type="button">Save draft</button>
    <button class="btn primary" id="btn-publish" type="button">Publish</button>
    <button class="btn primary" id="btn-update" type="button" style="display:none">Update</button>
    <button class="btn" id="btn-unpublish" type="button" style="display:none">Unpublish</button>
  </div>

  <main class="ed-layout">
    <input id="title" class="title-input" type="text" placeholder="Post title" maxlength="140" aria-label="Post title" />

    <section class="card">
      <div id="cover-empty" class="cover-box" tabindex="0" role="button" aria-label="Add cover photo">
        <i class="fa-regular fa-image" style="font-size:1.6rem"></i>
        <div><b>Cover photo</b> - click or drop an image here</div>
        <div class="hint">JPG, PNG, WebP, GIF or AVIF, up to 8 MB</div>
      </div>
      <div id="cover-filled" style="display:none">
        <img id="cover-img" alt="" style="max-width:100%;max-height:16rem;border-radius:.7rem;display:block;margin:0 auto" />
        <div class="field" style="margin:.8rem 0 0"><label for="cover-alt">Cover alt text (required to publish)</label>
          <input id="cover-alt" type="text" placeholder="Describe the image for screen readers" maxlength="200" /></div>
        <button class="btn sm danger" id="cover-remove" type="button" style="margin-top:.6rem">Remove cover</button>
      </div>
      <div class="progress" id="cover-progress"><div></div></div>
      <input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden />
    </section>

    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
      <button class="tb" data-cmd="undo" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="tb" data-cmd="redo" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
      <span class="tb-sep"></span>
      <select id="block" aria-label="Text style">
        <option value="p">Paragraph</option><option value="1">Heading 1</option><option value="2">Heading 2</option>
        <option value="3">Heading 3</option><option value="4">Heading 4</option>
      </select>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="bold" data-active="bold" title="Bold (Ctrl+B)"><i class="fa-solid fa-bold"></i></button>
      <button class="tb" data-cmd="italic" data-active="italic" title="Italic (Ctrl+I)"><i class="fa-solid fa-italic"></i></button>
      <button class="tb" data-cmd="underline" data-active="underline" title="Underline (Ctrl+U)"><i class="fa-solid fa-underline"></i></button>
      <button class="tb" data-cmd="strike" data-active="strike" title="Strikethrough"><i class="fa-solid fa-strikethrough"></i></button>
      <button class="tb" data-cmd="code" data-active="code" title="Inline code"><i class="fa-solid fa-code"></i></button>
      <button class="tb" data-cmd="highlight" data-active="highlight" title="Highlight"><i class="fa-solid fa-highlighter"></i></button>
      <input type="color" id="color" value="#06b6d4" title="Text colour" aria-label="Text colour" />
      <button class="tb" data-cmd="uncolor" title="Reset text colour"><i class="fa-solid fa-eraser"></i></button>
      <button class="tb" data-cmd="link" data-active="link" title="Link"><i class="fa-solid fa-link"></i></button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="bullet" data-active="bulletList" title="Bullet list"><i class="fa-solid fa-list-ul"></i></button>
      <button class="tb" data-cmd="ordered" data-active="orderedList" title="Numbered list"><i class="fa-solid fa-list-ol"></i></button>
      <button class="tb" data-cmd="task" data-active="taskList" title="Task list"><i class="fa-solid fa-list-check"></i></button>
      <button class="tb" data-cmd="quote" data-active="blockquote" title="Quote"><i class="fa-solid fa-quote-left"></i></button>
      <button class="tb" data-cmd="codeblock" data-active="codeBlock" title="Code block"><i class="fa-solid fa-file-code"></i></button>
      <button class="tb" data-cmd="hr" title="Divider"><i class="fa-solid fa-minus"></i></button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="alignLeft" data-align="left" title="Align left"><i class="fa-solid fa-align-left"></i></button>
      <button class="tb" data-cmd="alignCenter" data-align="center" title="Align centre"><i class="fa-solid fa-align-center"></i></button>
      <button class="tb" data-cmd="alignRight" data-align="right" title="Align right"><i class="fa-solid fa-align-right"></i></button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="table" title="Insert table"><i class="fa-solid fa-table"></i></button>
      <span class="table-tools" id="table-tools">
        <button class="tb" data-cmd="addRow" title="Add row below"><i class="fa-solid fa-plus"></i> row</button>
        <button class="tb" data-cmd="delRow" title="Delete row"><i class="fa-solid fa-minus"></i> row</button>
        <button class="tb" data-cmd="addCol" title="Add column right"><i class="fa-solid fa-plus"></i> col</button>
        <button class="tb" data-cmd="delCol" title="Delete column"><i class="fa-solid fa-minus"></i> col</button>
        <button class="tb" data-cmd="delTable" title="Delete table"><i class="fa-solid fa-trash"></i></button>
      </span>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="image" title="Insert image"><i class="fa-regular fa-image"></i></button>
      <button class="tb" data-cmd="youtube" title="Embed YouTube video"><i class="fa-brands fa-youtube"></i></button>
    </div>
    <input id="img-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple hidden />

    <div class="editor-card"><div id="editor"></div></div>
    <div class="statusbar"><span id="words">0 words</span><span id="reading">1 min read</span><span id="up" style="display:none">Uploading image...</span></div>

    <section class="card">
      <h3 style="margin:0 0 .8rem;font-size:1rem">Post settings</h3>
      <div class="settings">
        <div class="field"><label for="slug">URL slug</label><input id="slug" type="text" maxlength="80" placeholder="auto-from-title" /><span class="hint" id="slug-hint"></span></div>
        <div class="field"><label for="pubdate">Publish date (optional)</label><input id="pubdate" type="datetime-local" /><span class="hint">Leave empty to use the time you publish.</span></div>
      </div>
      <div class="field"><label for="excerpt">Excerpt (shown on the blog list)</label><textarea id="excerpt" rows="2" maxlength="300" placeholder="One or two sentences. Left empty, it is taken from the start of the post."></textarea></div>
      <div class="field"><label for="tag-input">Tags</label><div class="tags-box" id="tags-box"><input id="tag-input" type="text" placeholder="Type a tag, press Enter" /></div></div>
      <div class="settings">
        <div class="field"><label for="seo-title">SEO title</label><input id="seo-title" type="text" maxlength="70" placeholder="Defaults to the post title" /></div>
        <div class="field"><label for="seo-desc">SEO description</label><input id="seo-desc" type="text" maxlength="160" placeholder="Defaults to the excerpt" /></div>
      </div>
    </section>
  </main>

  <div class="slash" id="slash" role="listbox"></div>

  <dialog id="ask">
    <form method="dialog" id="ask-form">
      <h3 id="ask-title"></h3>
      <div class="field" style="margin:0"><label id="ask-label" for="ask-input"></label><input id="ask-input" type="text" autocomplete="off" /></div>
      <div class="row"><button class="btn" type="button" id="ask-cancel">Cancel</button><button class="btn primary" type="submit" id="ask-ok">OK</button></div>
    </form>
  </dialog>

  <div class="preview" id="preview">
    <div class="bar"><b>Preview</b><button class="btn sm" id="preview-close" type="button">Close</button></div>
    <div class="page" id="preview-page"></div>
  </div>

  <script src="/assets/sanitize-bundle.js"></script>
  <script src="/assets/admin/editor-bundle.js"></script>
  <script type="module" src="/assets/admin/editor.js"></script>
</body>
</html>
