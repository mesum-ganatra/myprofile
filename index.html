<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  
  <!-- Theme Init (Prevent Flash: Dark Mode by Default) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('portfolio_theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            slateBg: '#090d16',
            slateCard: '#0f172a',
            cyanGlow: '#06b6d4',
            tealGlow: '#14b8a6',
            indigoGlow: '#6366f1',
          }
        }
      }
    };
  </script>

  <!-- Custom Styles (Glassmorphism, Glows, Print Styles) -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 dark:bg-[#090d16] text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300 relative overflow-x-hidden selection:bg-cyan-500/30 selection:text-cyan-400">

  <!-- Ambient Decorative Background Glows -->
  <div class="ambient-glow-cyan top-0 left-1/4 w-96 h-96 -translate-y-1/2"></div>
  <div class="ambient-glow-purple top-1/3 right-10 w-96 h-96"></div>
  <div class="ambient-glow-cyan bottom-1/4 left-10 w-80 h-80"></div>

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-50 glass-nav transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo / Name Anchor -->
      <a href="#hero-section" id="nav-brand" class="text-xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2 group">
        <span class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-teal-400 flex items-center justify-center text-white text-sm font-extrabold shadow-sm group-hover:shadow-cyan-500/40 transition-all">
          <i class="fa-solid fa-code text-xs"></i>
        </span>
        <span id="nav-brand-text" class="group-hover:text-cyan-500 dark:group-hover:text-cyan-400 transition-colors">Portfolio</span>
      </a>

      <!-- Desktop Dynamic Navigation Links -->
      <nav aria-label="Main Navigation" class="hidden md:flex items-center gap-1 lg:gap-2">
        <div id="desktop-nav-links" class="flex items-center gap-1 text-sm font-medium text-slate-600 dark:text-slate-300">
          <!-- Dynamically inserted by app.js -->
        </div>
      </nav>

      <!-- Action Utilities: Theme Toggle & Mobile Menu Button -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Quick Print Action in Nav (Desktop) -->
        <button id="nav-print-btn" type="button" aria-label="Print to PDF" title="Print to PDF" class="hidden sm:inline-flex items-center justify-center w-9 h-9 rounded-lg text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 hover:bg-slate-200/60 dark:hover:bg-slate-800/70 transition-all text-sm">
          <i class="fa-solid fa-print"></i>
        </button>

        <!-- Light / Dark Mode Toggle Button -->
        <button id="theme-toggle" type="button" aria-label="Toggle Theme" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-800/80 transition-colors border border-slate-300/60 dark:border-slate-700/60">
          <i id="theme-toggle-icon" class="fa-solid fa-moon text-sm"></i>
        </button>

        <!-- Mobile Menu Toggle Hamburger -->
        <button id="mobile-menu-btn" type="button" aria-label="Open mobile menu" aria-expanded="false" class="md:hidden w-9 h-9 rounded-lg flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-800/80 transition-colors">
          <i class="fa-solid fa-bars text-base"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Dropdown Navigation -->
    <div id="mobile-menu" class="hidden md:hidden glass-nav border-t border-slate-200 dark:border-slate-800 px-4 py-3 space-y-1">
      <div id="mobile-nav-links" class="flex flex-col gap-1 text-sm font-medium text-slate-600 dark:text-slate-300">
        <!-- Dynamically inserted by app.js -->
      </div>
    </div>
  </header>

  <!-- Loading State Indicator -->
  <div id="loading-state" class="py-24 flex flex-col items-center justify-center gap-4 text-center">
    <div class="w-12 h-12 rounded-full border-4 border-cyan-500/20 border-t-cyan-500 animate-spin"></div>
    <p class="text-sm font-medium text-slate-500 dark:text-slate-400 animate-pulse">Loading portfolio content...</p>
  </div>

  <!-- Fallback Error Alert (e.g. Local File Protocol Warning) -->
  <div id="error-state" class="hidden max-w-2xl mx-auto my-12 p-6 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-900 dark:text-amber-200">
    <div class="flex items-start gap-3">
      <i class="fa-solid fa-triangle-exclamation text-amber-500 text-xl mt-0.5"></i>
      <div>
        <h3 class="font-bold text-base mb-1">Failed to load resume data</h3>
        <p id="error-message" class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed"></p>
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main id="main-content" class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 space-y-16 sm:space-y-24">
    
    <!-- Hero Section -->
    <section id="hero-section" class="hidden pt-4 sm:pt-8 scroll-mt-24"></section>

    <!-- About Section -->
    <section id="about-section" class="hidden scroll-mt-24"></section>

    <!-- Education Section -->
    <section id="education-section" class="hidden scroll-mt-24"></section>

    <!-- Skills Section -->
    <section id="skills-section" class="hidden scroll-mt-24"></section>

    <!-- Certificates Section -->
    <section id="certificates-section" class="hidden scroll-mt-24"></section>

    <!-- Languages Section -->
    <section id="languages-section" class="hidden scroll-mt-24"></section>

    <!-- Contact Section -->
    <section id="contact-section" class="hidden scroll-mt-24"></section>

  </main>

  <!-- Footer Container -->
  <footer id="footer-container" class="hidden border-t border-slate-200 dark:border-slate-800/80 bg-slate-100/60 dark:bg-slate-900/60 glass-panel py-10 transition-colors duration-300 mt-20"></footer>

  <!-- Script for Dynamic Logic -->
  <script src="app.js"></script>
</body>
</html>
